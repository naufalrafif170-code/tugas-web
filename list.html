<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pokémon Infinite Scroll</title>

    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #fce4ec, #e3f2fd);
            font-family: Arial, sans-serif;
            padding-bottom: 40px;
        }

        .navbar {
            background: #1E88E5;
            padding: 15px;
            text-align: center;
        }
        .navbar a { color: white; margin: 0 15px; text-decoration: none; }

        h2 { text-align: center; margin-top: 25px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            max-width: 700px;
            margin: 20px auto;
            padding: 10px;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s;
            animation: fadeIn 0.6s ease;
        }

        .card:hover { transform: scale(1.05); }

        .card img {
            width: 100px;
            height: 100px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loading {
            text-align: center;
            font-size: 18px;
            padding: 20px;
            color: #555;
        }
    </style>
</head>

<body>

<div class="navbar">
    <a href="index.html">Home</a>
    <a href="list.html">List</a>
    <a href="detail.html">Detail</a>
</div>

<h2>Infinite Scroll Pokémon</h2>

<div class="grid" id="pokemonList"></div>
<div class="loading" id="loading">Loading...</div>

<script>
    let offset = 0;
    const limit = 20;
    let loading = false;

    async function loadPokemon() {
        if (loading) return;
        loading = true;

        document.getElementById("loading").style.display = "block";

        let res = await fetch(`https://pokeapi.co/api/v2/pokemon?limit=${limit}&offset=${offset}`);
        let data = await res.json();

        let container = document.getElementById("pokemonList");

        for (let p of data.results) {
            let pokeRes = await fetch(p.url);
            let pokeData = await pokeRes.json();

            let img = pokeData.sprites.other["official-artwork"].front_default;

            container.innerHTML += `
                <div class="card">
                    <a href="detail.html?name=${p.name}">
                        <img src="${img}" alt="${p.name}">
                        <h3>${p.name.toUpperCase()}</h3>
                    </a>
                    >${p.name.toUpperCase()}</h3>
                </div>
            `;
        }

        offset += limit;
        loading = false;
        document.getElementById("loading").style.display = "none";
    }

    // Load pertama
    loadPokemon();

    // Event scroll
    window.addEventListener("scroll", () => {
        if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 100) {
            loadPokemon();
        }
    });
</script>

</body>
</html>
